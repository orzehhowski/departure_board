# .github/workflows/cd.yml
name: CD - Deploy to Production

# Trigger
on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'compose.yaml'

jobs:
  test:
    name: Health tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Start Docker Compose service
        run: docker compose up -d

      - name: Check service health
        uses: jaracogmbh/docker-compose-health-check-action@v1.0.0
        with:
          max-retries: 2
          retry-interval: 5
          compose-file: "compose.yaml"
          skip-exited: "false"
          skip-no-healthcheck: "false"
      - name: Wait 60s and check container status
        run: |
          sleep 60
          STATUS=$(docker inspect --format '{{.State.Status}}' bimba_api)
          if [ "$STATUS" != "running" ]; then
            echo "Container exited with status: $STATUS"
            docker logs bimba_api
            exit 1
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/bimba
            sudo git pull && sudo docker compose up -d --build
